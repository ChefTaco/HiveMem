services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: hivemem-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST — localhost by default
      - "127.0.0.1:6334:6334"   # gRPC — localhost by default
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 512M

  hivemem:
    # The release image, built from this checkout's root Dockerfile. Set HIVEMEM_IMAGE to run a
    # published release instead, for example ghcr.io/cheftaco/hivemem:<version>.
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${HIVEMEM_IMAGE:-hivemem:local}
    container_name: hivemem
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HIVEMEM_PORT:-18790}:18790"   # plain HTTP, so loopback only
    volumes:
      - hivemem_data:/data
    env_file:
      - ../.env   # needs HIVEMEM_JWT_SECRET; see the Quick Start in README.md
    environment:
      # These override ../.env, whose paths and host belong to a server run outside Docker.
      - HIVEMEM_QDRANT_URL=http://qdrant:6333
      - HIVEMEM_STORAGE_PATH=/data/memory
      - HIVEMEM_TS_CORE_HOST=0.0.0.0
      - HIVE_HEALTH_URL=http://localhost:18790/v1/health/ready
      - HIVE_AUTO_MIGRATE=${HIVE_AUTO_MIGRATE:-true}
      - HIVE_UPDATE_CHECK=false
      - HIVE_AUTO_UPGRADE=false
    depends_on:
      - qdrant
    profiles:
      - full   # `docker compose -f docker/docker-compose.yml --profile full up -d --build` also starts HiveMem.
               # For development, run `npm --prefix ts-core run dev` and start only qdrant here.

volumes:
  qdrant_data:
    driver: local
  hivemem_data:
    driver: local
