name: Publish SDK

# Publishes the TypeScript SDK @hivemagnus/hivemem-sdk (sdks/typescript) to npm with provenance.
# - Push a tag sdk-vX.Y.Z matching sdks/typescript/package.json to publish.
# - A version already on npm is skipped.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC). No npm token is stored in this repository.
# See sdks/typescript/RELEASING.md.

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      actions: read # read environment protection before any publication
      id-token: write # trusted publishing and provenance
    defaults:
      run:
        working-directory: sdks/typescript
    env:
      DRY_RUN: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require protected publication environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publish-environment.mjs

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require the tag to match the package version
        run: node scripts/publish-package.mjs --check-tag

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Gates
        run: |
          npm audit --omit=dev
          npm run typecheck
          npm run build
          npm test
          npm pack --dry-run --ignore-scripts
          npm run pack:check

      - name: Publish
        run: node scripts/publish-package.mjs
